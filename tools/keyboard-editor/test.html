<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>DGX-DI keyboard editor: its test</title>
    <link rel="stylesheet" href="https://unpkg.com/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="keyboard.css">
    <script src="https://unpkg.com/vue@3.5.13/dist/vue.global.js"></script>
    <script src="https://unpkg.com/vue-demi@0.14.10/lib/index.iife.js"></script>
    <script src="https://unpkg.com/pinia@2.3.1/dist/pinia.iife.js"></script>
    <script src="Layout.js"></script>
    <script src="Fonts.js"></script>
    <script src="Store.js"></script>
    <script src="KeyboardCanvas.js"></script>
    <script src="KeyboardProps.js"></script>
    <script src="KeyboardEdit.js"></script>
</head>

<body>
    <!-- The editor's actions on the layout it begins with, the workbench drawn meanwhile; what the browser keeps of it is
         put back after. Open it in a browser: the line on top says how it went (and the console). -->
    <div id="verdict" style="font: bold 20px sans-serif; padding: 6px">…</div>
    <div id="vue-app"></div>
    <script src="keyboard-app.js"> </script>
    <script>
        const fails = [], kept = localStorage.getItem(StorageKey), keptFont = localStorage.getItem(FontStorageKey), keptSteps = sessionStorage.getItem(StorageKey);
        // a font of DGX as font2c writes one, of three letters: a space, H and a
        const TinyFont = `#include "dgx_font.h"
static const uint8_t bitmaps[] = {
  /* 0020 - space */ 0x00
, /* 0048 - H */ 0x88, 0x88, 0xF8, 0x88, 0x88
, /* 0061 - a */ 0x70, 0x90, 0x70
};
static const glyph_t glyphs[] = {
    { {.bitmap = bitmaps +     0 },   1,   1,   3,    0,    0 } /* 0020 */
,   { {.bitmap = bitmaps +     1 },   5,   5,   6,    0,   -5 } /* 0048 */
,   { {.bitmap = bitmaps +     6 },   4,   3,   5,    0,   -3 } /* 0061 */
};
static const glyph_array_t glyph_ranges[] = {
   {0x20  , 0x1   , glyphs + 0 }
, {0x48  , 0x1   , glyphs + 1 }
, {0x61  , 0x1   , glyphs + 2 }
, {0x0   , 0x0   , 0 }
};
dgx_font_t* Tiny() {
	static dgx_font_t rval = {
		.glyph_ranges = glyph_ranges,
		.yAdvance = 7,
	.f_type = DGX_FONT_BITMAP_LINES,
		.number_of_ranges = 3
	};
	return &rval;
}`;
        const ok = (cond, what) => { if (!cond) fails.push(what); };
        // the mouse on the display at a pixel of it
        const mouse = (el, type, x, y) => {
            const r = el.getBoundingClientRect(), k = r.width / el.width;
            el.dispatchEvent(new MouseEvent(type, { bubbles: true, clientX: r.left + x * k, clientY: r.top + y * k }));
        };
        const wait = ms => new Promise(done => setTimeout(done, ms));
        (async () => {
        try {
            const s = useKeyboardStore(), L = KeyboardLayout;
            s.replace(L.starter());
            s.setDisplay(L.Displays[0]);
            s.edit.field = 'top', s.edit.mode = 'edit';
            s.showPage(0);
            ok(s.band && s.band.x === 289 && s.band.y === 262 && s.band.w === 445 && s.band.h === 338, 'the code on the 7": as DGX-DI places it');
            ok(s.keys.length === 12 && s.keys[0].w === 133, 'its keys');
            // a key changed, undone, redone
            s.choose(0, 0);
            s.setKey({ char: 'z', upper: 'Z' });
            ok(s.layout.pages[0].rows[0][0].char === 'z', 'a key changed');
            s.undo();
            ok(s.layout.pages[0].rows[0][0].char === '1', 'undone');
            s.redo();
            ok(s.layout.pages[0].rows[0][0].upper === 'Z', 'redone');
            // the keys of undo whatever the layout of the computer's keyboard (Ctrl+Я on ЙЦУКЕН), from a list too; a field of
            // text keeps its own
            const keyDown = (el, init) => el.dispatchEvent(new KeyboardEvent('keydown', Object.assign({ bubbles: true, cancelable: true }, init)));
            await Vue.nextTick();
            keyDown(document.body, { key: 'я', code: 'KeyZ', ctrlKey: true });
            ok(s.layout.pages[0].rows[0][0].char === '1', 'Ctrl+Я undoes');
            keyDown(document.body, { key: 'Я', code: 'KeyZ', ctrlKey: true, shiftKey: true });
            ok(s.layout.pages[0].rows[0][0].char === 'z', 'Ctrl+Shift+Я redoes');
            const list = document.querySelector('.kb-zoom'), textField = document.querySelector('input:not([type])');
            keyDown(list, { key: 'z', code: 'KeyZ', ctrlKey: true });
            ok(s.layout.pages[0].rows[0][0].char === '1', 'Ctrl+Z from the list of zooms undoes');
            keyDown(list, { key: 'y', code: 'KeyY', ctrlKey: true });
            ok(s.layout.pages[0].rows[0][0].char === 'z', 'Ctrl+Y from it redoes');
            keyDown(textField, { key: 'z', code: 'KeyZ', ctrlKey: true });
            ok(textField && s.layout.pages[0].rows[0][0].char === 'z', 'Ctrl+Z in a field of text is the field\'s');
            // the steps to undo through a reload: kept for the tab, put back with the layout
            const steps = s.history.length;
            s.history = [], s.future = [];
            s.restore();
            ok(steps > 0 && s.history.length === steps, 'the steps to undo after a reload: ' + s.history.length + ' of ' + steps);
            s.undo();
            // keys and rows added, moved, taken away
            s.addKey(true);
            ok(s.layout.pages[0].rows[0].length === 4 && s.edit.key === 1 && s.layout.pages[0].rows[0][1].char === '?', 'a key added after the chosen');
            s.moveKey(1);
            ok(s.layout.pages[0].rows[0][2].char === '?' && s.edit.key === 2, 'moved to the right');
            s.removeKey();
            ok(s.layout.pages[0].rows[0].length === 3, 'taken away');
            s.addRow(true);
            ok(s.layout.pages[0].rows.length === 5 && s.edit.row === 1, 'a row added below');
            s.moveRow(-1);
            ok(s.edit.row === 0 && s.layout.pages[0].rows[0].length === 1, 'moved up');
            s.removeRow();
            ok(s.layout.pages[0].rows.length === 4, 'the row taken away');
            // pages: one after the first; a key to it; another between them, the key following its page
            s.addPage();
            ok(s.layout.pages.length === 2 && s.edit.page === 1 && s.layout.pages[1].rows[0][0].page === 0, 'a page with a key back');
            s.showPage(0), s.choose(3, 0);
            s.setKey({ action: undefined, page: 1, label: 'next' });
            ok(s.layout.pages[0].rows[3][0].page === 1 && L.label(s.layout.pages[0].rows[3][0], false) === 'next', 'a key of a page');
            s.showPage(0);
            s.addPage();
            ok(s.layout.pages.length === 3 && s.layout.pages[0].rows[3][0].page === 2, 'a page put between: the key follows its page');
            s.removePage();
            ok(s.layout.pages.length === 2 && s.layout.pages[0].rows[3][0].page === 1, 'taken away: the key back');
            // the trial, as DGX-DI types
            s.edit.mode = 'try', s.trial.page = 0;
            const find = pred => s.keys.findIndex(k => pred(k.key));
            s.type(find(k => k.char === '1')), s.type(find(k => k.char === '2'));
            ok(s.trial.text === '12', 'typed');
            s.type(find(k => k.page === 1));
            ok(s.trial.page === 1 && s.keys.length === 2, 'to the other page');
            s.type(find(k => k.page === 0));
            s.type(find(k => k.action === 'done'));
            ok(s.trial.flash === 'done' && s.trial.text === '12', 'done');
            s.edit.mode = 'edit';
            // not taken: a display too narrow, a file not of the format, not JSON
            s.setDisplay({ name: 'tiny', width: 40, height: 600, widthMm: 6, heightMm: 86 });
            ok(!s.band && s.problems.some(p => p.level === 'error'), 'a display too narrow told');
            s.setDisplay(L.Displays[0]);
            const pages = s.layout.pages.length;
            s.open('{"format": "other"}', 'other.json');
            ok(s.layout.pages.length === pages && /not a layout/.test(s.message), 'a file of another format refused');
            s.open('{', 'broken.json');
            ok(/not JSON/.test(s.message), 'not JSON refused');
            // the file: as the format has it, read back the same
            const text = L.toJson(s.layout);
            s.open(text, 'again.json');
            ok(L.toJson(s.layout) === text && !L.check(JSON.parse(text)), 'written and read back the same');
            s.newLayout();
            ok(s.layout.pages.length === 1 && s.layout.pages[0].rows.length === 4, 'a new layout');
            // the mouse: a key chosen by a click; tried, typed when let go on it, erase held again and again
            s.edit.mode = 'edit', s.edit.zoom = 1;
            await Vue.nextTick();
            const canvas = document.querySelector('.kb-canvas'), key = i => s.keys[i], mid = i => [key(i).x + key(i).w / 2, key(i).y + key(i).h / 2];
            mouse(canvas, 'mousedown', ...mid(4)), mouse(canvas, 'mouseup', ...mid(4));
            ok(s.edit.row === 1 && s.edit.key === 1, 'the key 5 chosen by a click');
            s.edit.mode = 'try', s.trial.text = '';
            await Vue.nextTick();
            mouse(canvas, 'mousedown', ...mid(0)), mouse(canvas, 'mouseup', ...mid(0));
            mouse(canvas, 'mousedown', ...mid(1)), mouse(canvas, 'mouseleave', 0, 0);
            ok(s.trial.text === '1', 'typed when let go on it, not when led away');
            s.trial.text = '123456';
            mouse(canvas, 'mousedown', ...mid(9));
            await wait(800);
            mouse(canvas, 'mouseup', ...mid(9));
            ok(s.trial.text.length <= 3 && s.trial.text.length >= 1, 'erase held: again and again (' + s.trial.text + ')');
            s.edit.mode = 'edit';
            // the menu of templates: opened by New, one chosen, undone as one, closed by a click elsewhere; each laid out
            await Vue.nextTick();
            const newButton = [...document.querySelectorAll('.kb-top button')].find(b => b.textContent.trim() === 'New');
            newButton.click();
            await Vue.nextTick();
            const menu = document.querySelector('.kb-templates'), entries = [...menu.querySelectorAll('.dropdown-item')];
            ok(menu.classList.contains('show') && entries.length === L.Templates.length, 'the menu of templates');
            entries.find(a => a.textContent.includes('Russian')).click();
            await Vue.nextTick();
            ok(!menu.classList.contains('show') && s.layout.pages.length === 3 && s.keys[0].key.char === 'й', 'a template chosen: ЙЦУКЕН');
            s.undo();
            ok(s.layout.pages.length !== 3, 'undone');
            newButton.click();
            await Vue.nextTick();
            document.querySelector('.kb-status').dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));
            await Vue.nextTick();
            ok(!menu.classList.contains('show'), 'closed by a click elsewhere');
            for (const t of L.Templates) {
                s.newLayout(t.name);
                await Vue.nextTick();
                ok(s.band && s.keys.length > 0, t.name + ': laid out');
            }
            // the font of the labels: a font of DGX of its C, drawn as on the board; the keys of letters it has not; the
            // browser's own again, undone; the size of a face of a file; a face of the computer by its PostScript name
            s.newLayout('russian');
            s.edit.mode = 'edit';
            s.useDgxFont(TinyFont, 'tiny.c');
            await Vue.nextTick();
            ok(s.layout.font && s.layout.font.dgx === 'Tiny' && s.labelFont.kind === 'dgx' && s.labelFont.px === 7, 'a font of DGX taken: ' + s.message);
            ok(s.fontLacking.length > 30 && s.problems.some(p => /the font has no й/.test(p.text)), 'the keys of letters it has not told');
            ok(/"font": \{"dgx": "Tiny"\}/.test(L.toJson(s.layout)), 'written in the file of the layout');
            const pixels = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height).data;
            let red = 0;
            for (let i = 0; i < pixels.length; i += 4) if (pixels[i] === 0xff && pixels[i + 1] === 0x4d && pixels[i + 2] === 0x4f) ++red;
            ok(red > 100, 'the keys of letters it has not marked red (' + red + ' pixels)');
            s.useBrowserFont();
            ok(!s.layout.font && s.labelFont.kind === 'browser' && !s.fontLacking.length, 'the browser\'s own again');
            s.undo();
            ok(s.layout.font && s.labelFont.kind === 'dgx', 'undone: the font of DGX again');
            s.change(l => { l.font = { family: 'DejaVu Sans', style: 'Book', postscript: 'DejaVuSans', px: 30 }; });
            ok(s.labelFont.px === 30 && s.labelFont.mm === 4.5, 'a layout of before: its pixels, in millimetres ' + s.labelFont.mm);
            s.setFontMm(5.4);
            ok(s.layout.font.mm === 5.4 && s.layout.font.px === undefined && s.labelFont.px === 36, 'a face of a file made larger, in millimetres: ' + s.labelFont.px + ' px');
            ok(/"font": \{"family": "DejaVu Sans", "style": "Book", "postscript": "DejaVuSans", "mm": 5\.4\}/.test(L.toJson(s.layout)), 'written with its millimetres');
            await s.restoreFont();
            await Vue.nextTick();
            ok(s.labelFont.kind === 'system' || /not on this computer/.test(s.message), 'a face of the computer by its PostScript name: ' + s.labelFont.kind);
            s.useBrowserFont();
        } catch (e) {
            fails.push('thrown: ' + e.stack);
        }
        if (kept === null) localStorage.removeItem(StorageKey);
        else localStorage.setItem(StorageKey, kept);
        if (keptFont === null) localStorage.removeItem(FontStorageKey);
        else localStorage.setItem(FontStorageKey, keptFont);
        if (keptSteps === null) sessionStorage.removeItem(StorageKey);
        else sessionStorage.setItem(StorageKey, keptSteps);
        const verdict = fails.length ? 'EDITOR FAILED: ' + fails.join('; ') : 'EDITOR OK';
        document.getElementById('verdict').textContent = verdict;
        document.getElementById('verdict').style.color = fails.length ? '#b02a37' : '#146c43';
        console.log(verdict);
        })();
    </script>
</body>

</html>
