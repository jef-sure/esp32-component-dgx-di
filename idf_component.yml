## IDF Component Manager Manifest File
version: "0.0.2"
description: "Touch input for DGX displays: the fingers of a touch panel as fingers of the display, turned with the screen; a calibration measured on the board; gestures in millimetres; buttons the program draws; a translucent game pad in a layer of DGX and a keyboard on the display, with editors of their layouts and looks; a GSL3680 driver and any esp_lcd_touch panel"
url: https://github.com/jef-sure/esp32-component-dgx-di
repository: https://github.com/jef-sure/esp32-component-dgx-di.git
documentation: https://github.com/jef-sure/esp32-component-dgx-di/blob/main/README.md
issues: https://github.com/jef-sure/esp32-component-dgx-di/issues

dependencies:
  idf:
    version: ">=5.3.0"  # esp_driver_i2c, the I2C master driver as its own component
  jef-sure/dgx:
    version: "^0.7.2"  # the screen a pointer and a touch are on, the overlay layer of a screen for the pad (since 0.6.6); 0.7: its sources by topic; 0.7.2: font needs, a keyboard's font made at the build

tags:
  - touch
  - touchscreen
  - input
  - gestures
  - gamepad
  - keyboard
  - calibration
  - gsl3680
  - esp_lcd_touch
  - dgx

maintainers:
  - "Anton Petrusevich <anton.petrusevich.mobile@gmail.com>"

license: MIT

files:
  include:
    - "idf_component.yml"
    - "CMakeLists.txt"
    - "project_include.cmake"  # dgx_di_keyboard_font() for a program's CMakeLists
    - "src/**/*.c"
    - "include/**/*.h"
    - "tools/**/*.py"
    - "tools/**/*.js"   # the editors, in the browser
    - "tools/**/*.html"
    - "tools/**/*.css"
    - "tools/**/*.json"
    - "tools/**/*.md"
    - "README.md"
    - "CHANGES.md"
    - "LICENSE"
  exclude:
    - "build/**"
    - ".git/**"
    - "test/host/build/**"
    - "**/__pycache__/**"
    - "docs/design-ru.md"    # internal
    - "docs/decisions-ru.md" # internal
